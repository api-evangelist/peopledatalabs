deployment:
  mode: remote
  endpoint: https://docs.peopledatalabs.com/mcp
  auth: none
  verified: probed
  note: >-
    The manifest at https://docs.peopledatalabs.com/.well-known/mcp.json advertises
    a single public server whose canonical URL is the Mintlify tenant
    https://peopledatalabs.main-kill-isr.mintlify.me/mcp. Both that URL and the
    provider-domain alias https://docs.peopledatalabs.com/mcp answer an
    unauthenticated tools/list with the same three tools; the provider-domain alias
    is recorded as the endpoint an agent should call. There is no stdio package —
    People Data Labs publishes no MCP package on npm or PyPI.
server:
  name: People Data Labs Documentation
  transport: http
  url: https://docs.peopledatalabs.com/mcp
  manifest_version: 1.0.0
  vendor_platform: Mintlify
  tenant_url: https://peopledatalabs.main-kill-isr.mintlify.me/mcp
  authentication: none
scope:
  surface: documentation
  covers_data_api: false
  note: >-
    IMPORTANT — this MCP server exposes the People Data Labs DOCUMENTATION, not the
    People Data Labs data API. Its tools search and read docs pages; none of them
    call /v5/person/enrich, /v5/company/enrich or any other api.peopledatalabs.com
    operation. An agent can use it to learn how to call the API, but it cannot use
    it to enrich a person or a company. The divergence is recorded in
    mcp/peopledatalabs-tool-crosswalk.yml.
tools:
- name: search_people_data_labs_documentation
  title: Search documentation
  description: >-
    Search across the People Data Labs Documentation knowledge base to find relevant
    information, code examples, API references, and guides.
  input_schema:
    query: string (required)
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: query_docs_filesystem_people_data_labs_documentation
  description: >-
    Run a read-only shell-like query (head/cat/ls/grep style) against a virtualized
    in-memory filesystem containing only the People Data Labs documentation pages and
    OpenAPI specs.
  input_schema:
    command: string (required)
- name: submit_feedback
  title: Submit documentation feedback
  description: Submit feedback about a documentation page.
  input_schema:
    path: string
    feedback: string
raw_tools_list: peopledatalabs-mcp-tools.json
third_party:
- name: peopledatalabs-mcp
  url: https://github.com/phxdev1/peopledatalabs-mcp
  official: false
  note: >-
    A community MCP server wrapping the PDL data API exists on GitHub under the
    phxdev1 account. It is NOT published or endorsed by People Data Labs and is
    recorded here only so it is not mistaken for a first-party surface.
