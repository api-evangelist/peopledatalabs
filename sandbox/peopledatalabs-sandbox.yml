sdk_switches:
- language: python
  snippet: 'CLIENT = PDLPY(api_key="YOUR API KEY", sandbox=True)'
- language: javascript
  snippet: 'const params = { email: "irussell@example.org", min_likelihood: 6, sandbox: true }'
- language: ruby
  snippet: 'Peopledatalabs.sandbox = true'
- language: go
  snippet: 'client := pdl.New(apiKey, api.ClientOptions(func(c *api.Client) { c.Sandbox = true }))'
test_values:
  note: >-
    People Data Labs publishes no magic test identifiers, test cards or fixture triggers.
    The only documented sandbox input appearing in the docs is the example address
    irussell@example.org in the JavaScript snippet above, which is illustrative rather
    than a guaranteed-match fixture. Nothing further is recorded because nothing further
    is published.
