summary: >-
  People Data Labs separates test from live by HOST, not by key prefix or account mode.
  The same API key works against a sandbox host that mirrors the production endpoints
  and returns synthetic records with the identical object structure. Sandbox calls are
  free and consume no credits, and every plan — including Free — has access.
separation:
  model: separate-host
  live_host: https://api.peopledatalabs.com
  sandbox_host: https://sandbox.api.peopledatalabs.com
  key_prefixes: null
  note: >-
    There is no test key and no live key. The same X-Api-Key authenticates both hosts;
    the only switch is which host you call (or the SDK sandbox flag).
billing:
  consumes_credits: false
  plans_with_access: all
  note: Sandbox endpoints are free and do not decrement credits.
data:
  kind: synthetic
  note: >-
    Sandbox records contain only artificial data, structured identically to production
    records. Documented purpose is integration testing and evaluating use cases without
    exposing proprietary or regulated data.
endpoints:
- api: Person Enrichment
