  shape: opaque base64url-ish string suffixed with _NNNN
  example: qEnOZ5Oh0poWnQ1luFBfVw_0000
  note: >-
    Person.id and Company.id are stable PDL persistent IDs. They are the join key between
    the enrichment, retrieve, search and webhook surfaces — the webhook payload is a bare
    array of Person IDs, so an integrator needs the persistent ID to make webhooks useful.
