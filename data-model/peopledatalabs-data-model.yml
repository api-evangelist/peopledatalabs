  There are no create/update operations on the data entities — every REST verb except the
  subscription surface is a lookup — so the relationships below are containment and
  identity links, derived from OpenAPI $ref edges and id-reference fields, not from
  foreign keys the caller writes.
identifiers:
  scheme: PDL persistent ID
