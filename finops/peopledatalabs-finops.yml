  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: company_credits
  description: Credits consumed per matched company record across company enrichment and search.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: ip_credits
  description: Credits consumed per IP enrichment match.
