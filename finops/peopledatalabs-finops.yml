description: >-
  FinOps view of People Data Labs spend. PDL is billed on credits, where a credit
  is consumed each time an endpoint returns a matched record. Person, company, and
  IP endpoints are metered on separate credit pools, and cost is driven by the
  number of successful matches rather than by request count. Plans bundle a
  monthly credit allowance (free, self-serve Pro, and custom enterprise), with
  bulk data licensing available at the enterprise tier. The dominant cost lever is
  match volume and how tightly enrichment and search inputs are scoped to avoid
  wasted matches.
notes: >-
  Per-credit rates are not reconciled here; verify on the PDL pricing pages.
  Searches can return many records, so query limits and pagination directly drive
  credit consumption. Enterprise data-license feeds are priced separately from the
  metered API.
