principles:
- name: Visibility
  description: Track credit burn per endpoint and per credit pool (person, company, IP); read rate-limit headers to correlate volume with spend.
- name: Allocation
  description: Use separate API keys per team or workload so credit consumption maps to internal cost centers.
- name: Optimization
  description: Tighten enrichment inputs to raise match rates, scope search queries and pagination to only needed records, and use the Cleaner APIs to normalize inputs before spending enrichment credits.
- name: Accountability
  description: Assign owners per key and review monthly credit consumption against plan allowances before overage or upgrade.
