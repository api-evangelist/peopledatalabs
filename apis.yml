aid: peopledatalabs
url: https://raw.githubusercontent.com/api-evangelist/peopledatalabs/refs/heads/main/apis.yml
name: People Data Labs
kind: company
description: People Data Labs (PDL) is a B2B data enrichment and web intelligence provider offering a REST API over
  a dataset of nearly three billion person profiles and tens of millions of company records. The api.peopledatalabs.com/v5
  API lets developers enrich, identify, and search person and company data, resolve contacts and firmographics,
  look up companies from a domain or LinkedIn URL, and clean and standardize job titles, skills, schools, companies,
  and locations. Authentication is a single X-Api-Key header, all endpoints are HTTPS REST, and PDL publishes an
  official OpenAPI specification.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: true
  try_now: true
  public: false
  label: Freemium (free trial) · Self-serve signup
